<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Live</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192x192.png" type="image/png">
<meta name="theme-color" content="#0e1013">
<link rel="preconnect" href="https://master4.cdnid.win">
<link rel="preconnect" href="https://master3.s5stream.top">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer></script>
<script src="js/player.js" defer></script>
</head>
<body>

<!-- ─── SPLASH ─────────────────────────────── -->
<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="splash-brand">FORMULA 1</div>
    <h1 class="splash-title"><em>F1</em> Live</h1>
    <div class="splash-sub">Select server to begin</div>

    <div class="servers">
      <button class="server-btn" id="btnTurbo" data-server="turbo">
        <div class="label">
          <span class="dot" id="dotTurbo"></span>
          TURBO
        </div>
        <div class="meta">CDN — cdnid.win</div>
        <div class="latency" id="latTurbo">checking...</div>
      </button>
      <button class="server-btn" id="btnEkonomi" data-server="ekonomi">
        <div class="label">
          <span class="dot" id="dotEkonomi"></span>
          EKONOMI
        </div>
        <div class="meta">CDN — s5stream.top</div>
        <div class="latency" id="latEkonomi">checking...</div>
      </button>
    </div>

    <div class="splash-foot">Stream dienkripsi &middot; Segmen ter-cache &middot; HLS v6</div>
  </div>
</div>

<!-- ─── LOADING VEIL ─────────────────────── -->
<div class="loading-veil" id="loadingVeil">
  <div class="loading-card">
    <div class="loading-name" id="loadName">TURBO</div>
    <div class="loading-res" id="loadRes">480p &middot; Membangun buffer...</div>
    <div class="loading-rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
    <div class="loading-status" id="loadStatus">Menginisialisasi stream...</div>
    <div class="loading-meter">
      <div class="loading-fill" id="loadFill"></div>
    </div>
  </div>
</div>

<!-- ─── PLAYER ────────────────────────────── -->
<div class="player-shell" id="playerShell">
  <header class="topbar">
    <span class="brand">F1 LIVE</span>
    <span class="sep"></span>
    <span class="info" id="tpServerLabel">—</span>
    <span class="sep"></span>
    <span class="chip live" id="tpStatus"><span class="pip"></span> <span id="statusTxt">idle</span></span>
    <span class="spacer"></span>
    <span class="info" id="tpBw">— Kbps</span>
    <span class="sep"></span>
    <button class="btn-ghost" id="btnDebug">Debug</button>
    <span class="sep"></span>
    <button class="btn-ghost" id="btnBack">Ganti Server</button>
  </header>

  <div class="stage">
    <div class="video-frame">
      <video id="video" playsinline muted></video>
    </div>

    <!-- HUD -->
    <div class="hud">
      <!-- Resolution picker -->
      <div class="res-menu">
        <button class="btn-ghost" id="btnResToggle">480p</button>
        <div class="res-pop" id="resPop">
          <button data-level="1" data-label="720p">720p</button>
          <button data-level="2" data-label="480p" class="active">480p</button>
          <button data-level="3" data-label="360p">360p</button>
        </div>
      </div>

      <button class="btn-ghost" id="btnUnmute">Aktifkan Suara</button>
      <button class="btn-ghost" id="btnReload">Reload</button>
      <button class="btn-ghost" id="btnFullscreen">Fullscreen</button>
    </div>

    <!-- Debug drawer -->
    <div class="debug-drawer" id="debugDrawer">
      <div class="debug-head">
        <span>Debug</span>
        <button class="btn-ghost" id="btnDebugClose">Tutup</button>
      </div>
      <div class="debug-body">
        <div class="debug-row"><span class="k">Server</span><span class="v" id="dbServer">—</span></div>
        <div class="debug-row"><span class="k">URL</span><span class="v" id="dbUrl" style="word-break:break-all;font-size:10px;">—</span></div>
        <div class="debug-row"><span class="k">Resolusi</span><span class="v" id="dbRes">—</span></div>
        <div class="debug-row"><span class="k">Buffer ahead</span><span class="v" id="dbBuf">—</span></div>
        <div class="debug-row"><span class="k">Bandwidth</span><span class="v" id="dbBw">—</span></div>
        <div class="debug-row"><span class="k">Latency live</span><span class="v" id="dbLat">—</span></div>
        <div class="debug-row"><span class="k">Playback rate</span><span class="v" id="dbRate">—</span></div>
        <div class="debug-row"><span class="k">Frag sn</span><span class="v" id="dbFrag">—</span></div>
        <div class="debug-row"><span class="k">SW cache hits</span><span class="v" id="dbSw">0</span></div>
        <div class="debug-log" id="dbLog"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
