<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Player v4</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <span class="live-dot"></span>
    <h1>F1 LIVE v4</h1>
    <div class="bandwidth-meter" id="bandwidthMeter">0 Kbps</div>
    <span class="status" id="status">idle</span>
  </div>

  <div class="main">
    <div class="video-side">
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="Paste stream URL (.m3u8) here..." />
        <button class="go" id="loadBtn">LOAD</button>
      </div>

      <div class="video-box">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="loadingText">connecting...</div>
          <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
          </div>
        </div>
        <video id="video" controls playsinline></video>
      </div>

      <div class="controls">
        <button class="ctrl" id="proxyToggle">PROXY</button>
        <button class="ctrl" id="clearLog">CLEAR LOG</button>
        <button class="ctrl" id="reloadBtn">RELOAD</button>
        <span class="sep"></span>
        <button class="ctrl" id="copyUrl">COPY URL</button>
      </div>

      <div class="presets">
        <div class="presets-label">Quick Presets (direct level — bypass multivariant):</div>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/0/stream.m3u8">M2 1080p</button>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/1/stream.m3u8">M2 720p</button>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/2/stream.m3u8">M2 480p</button>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/3/stream.m3u8">M2 360p (Fast)</button>
        <button class="preset-btn" data-url="https://master4.hdtvs2.top/hls/0/stream.m3u8">M4 1080p</button>
        <button class="preset-btn" data-url="https://master4.hdtvs1.top/hls/2/stream.m3u8">M4 480p</button>
        <button class="preset-btn" data-url="http://148.251.6.207:8087/hls/stream.m3u8">IP:8087</button>
      </div>

      <div class="url-label" id="urlLabel">no stream loaded</div>
    </div>

    <div class="log-side">
      <div class="log-header">
        <span>LIVE LOG</span>
        <div class="log-filter">
          <label><input type="checkbox" data-type="info" checked> Info</label>
          <label><input type="checkbox" data-type="ok" checked> Ok</label>
          <label><input type="checkbox" data-type="warn" checked> Warn</label>
          <label><input type="checkbox" data-type="err" checked> Err</label>
          <label><input type="checkbox" data-type="debug"> Debug</label>
        </div>
        <span id="logCount">0</span>
      </div>
      <div class="log-entries" id="logBox"></div>
    </div>
  </div>

  <script src="js/player.js"></script>
</body>
</html>
