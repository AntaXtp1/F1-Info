<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Player v4</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Fullscreen Loading Overlay (Startup Lock) -->
  <div class="startup-overlay" id="startupOverlay">
    <div class="startup-box">
      <div class="live-dot big"></div>
      <h2 class="startup-title">F1 LIVE STREAM</h2>
      <p class="startup-subtitle">initiating parallel segment prefetch...</p>
      
      <div class="startup-progress-bg">
        <div class="startup-progress-bar" id="startupProgressBar"></div>
      </div>
      <div class="startup-stats" id="startupStats">loading segments: 0.0s / 7.0s</div>
      <button class="startup-skip-btn" id="startupSkipBtn">SKIP LOADING</button>
    </div>
  </div>

  <div class="header">
    <span class="live-dot"></span>
    <h1>F1 LIVE v4</h1>
    <div class="bandwidth-meter" id="bandwidthMeter">0 Kbps</div>
    <span class="status" id="status">idle</span>
  </div>

  <div class="main">
    <div class="video-side">
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="Paste stream URL (.m3u8) here..." />
        <button class="go" id="loadBtn">LOAD</button>
      </div>

      <div class="video-box">
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="loadingText">connecting...</div>
          <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
          </div>
        </div>
        <video id="video" controls playsinline muted></video>
      </div>

      <div class="controls">
        <button class="ctrl" id="proxyToggle">PROXY</button>
        <button class="ctrl" id="clearLog">CLEAR LOG</button>
        <button class="ctrl" id="reloadBtn">RELOAD</button>
        <button class="ctrl" id="debugToggle">DEBUG</button>
        <span class="sep"></span>
        <button class="ctrl" id="copyUrl">COPY URL</button>
      </div>

      <div class="presets">
        <div class="presets-label">Quick Presets (direct level — bypass multivariant):</div>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/1/stream.m3u8">M2 720p</button>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/2/stream.m3u8">M2 480p</button>
        <button class="preset-btn" data-url="https://master2.hdtvs2.top/hls/3/stream.m3u8">M2 360p (Fast)</button>
      </div>

      <div class="url-label" id="urlLabel">no stream loaded</div>
    </div>

    <div class="log-side" id="logSide">
      <div class="log-header">
        <span>LIVE LOG (ALL)</span>
        <button class="ctrl" id="closeLogBtn" style="padding: 2px 8px; font-size: 10px;">CLOSE</button>
      </div>
      <div class="log-entries" id="logBox"></div>
    </div>
  </div>

  <script src="js/player.js"></script>
</body>
</html>
